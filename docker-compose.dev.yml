services:
  ome:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    restart: unless-stopped
    extra_hosts:
      # allows the container to reach the api running on the host
      - "host.docker.internal:host-gateway"
    environment:
      OME_RTMP_PROV_PORT: 1935
      OME_LLHLS_PORT: 3333
      OME_API_PORT: 8081
      OME_API_ACCESS_TOKEN: livestreamx
      OME_ADMISSION_URL: http://host.docker.internal:1337/streams/auth
      OME_ADMISSION_SECRET: livestreamx
    ports:
      # rtmp ingest for obs
      - "1935:1935"
      # ll-hls + thumbnails (host 3334 because 3333 is often already taken)
      - "3334:3333"
      # rest api
      - "9998:8081"
    volumes:
      - ./ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ./ome/Logger.xml:/opt/ovenmediaengine/bin/origin_conf/Logger.xml:ro

  redis:
    image: redis:latest
    ports:
      - "8879:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
      POSTGRES_DB: stream
    ports:
      - "8832:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10.11-scratch
    command: -js -m 8222
    restart: always
    ports:
      - '8223:4222'

volumes:
  postgres:
