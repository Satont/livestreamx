services:
  api:
    image: ghcr.io/satont/livestreamx:api-latest
    build:
        context: .
        dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # internal compose addresses, always point to the ome service here
      OME_API_ADDR: http://ome:8081
      OME_LLHLS_ADDR: http://ome:3333
    networks:
      - default
      - traefik-public
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # https://<domain>/api/* -> api:1337/* (/api prefix is stripped)
      - "traefik.http.routers.streamx-api.rule=Host(`${DOMAIN:-streamx.satont.dev}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.streamx-api.entrypoints=websecure"
      - "traefik.http.routers.streamx-api.priority=100"
      - "traefik.http.routers.streamx-api.middlewares=streamx-strip-api"
      - "traefik.http.routers.streamx-api.service=streamx-api"
      - "traefik.http.routers.streamx-api.tls.certresolver=le"
      - "traefik.http.middlewares.streamx-strip-api.stripprefix.prefixes=/api"
      - "traefik.http.services.streamx-api.loadbalancer.server.port=1337"

  frontend:
    image: ghcr.io/satont/livestreamx:frontend-latest
    restart: always
    build:
        context: .
        dockerfile: apps/frontend/Dockerfile
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.streamx.rule=Host(`${DOMAIN:-streamx.satont.dev}`)"
      - "traefik.http.routers.streamx.entrypoints=websecure"
      - "traefik.http.routers.streamx.priority=1"
      - "traefik.http.routers.streamx.service=streamx-frontend"
      - "traefik.http.routers.streamx.tls.certresolver=le"
      - "traefik.http.services.streamx-frontend.loadbalancer.server.port=8080"
      # http -> https
      - "traefik.http.routers.streamx-http.rule=Host(`${DOMAIN:-streamx.satont.dev}`)"
      - "traefik.http.routers.streamx-http.entrypoints=web"
      - "traefik.http.routers.streamx-http.service=streamx-frontend"
      - "traefik.http.routers.streamx-http.middlewares=streamx-https-redirect"
      - "traefik.http.middlewares.streamx-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.streamx-https-redirect.redirectscheme.permanent=true"

  ome:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    restart: always
    environment:
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN:-livestreamx}
      OME_ADMISSION_URL: http://api:1337/streams/auth
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:-livestreamx}
    ports:
      # rtmp ingest for obs
      - "1935:1935"
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      # https://<domain>/mtx/* -> ome:3333/* (/mtx prefix is stripped)
      - "traefik.http.routers.streamx-mtx.rule=Host(`${DOMAIN:-streamx.satont.dev}`) && PathPrefix(`/mtx`)"
      - "traefik.http.routers.streamx-mtx.entrypoints=websecure"
      - "traefik.http.routers.streamx-mtx.priority=100"
      - "traefik.http.routers.streamx-mtx.middlewares=streamx-strip-mtx"
      - "traefik.http.routers.streamx-mtx.service=streamx-mtx"
      - "traefik.http.routers.streamx-mtx.tls.certresolver=le"
      - "traefik.http.middlewares.streamx-strip-mtx.stripprefix.prefixes=/mtx"
      - "traefik.http.services.streamx-mtx.loadbalancer.server.port=3333"
    volumes:
      - ./ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ./ome/Logger.xml:/opt/ovenmediaengine/bin/origin_conf/Logger.xml:ro

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: livestreamx
      POSTGRES_PASSWORD: livestreamx
      POSTGRES_DB: livestreamx
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10.11-scratch
    command: -js -m 8222
    restart: always

volumes:
    postgres:
    redis:

networks:
  traefik-public:
    external: true
