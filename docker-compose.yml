services:
  api:
    image: ghcr.io/satont/livestreamx:api-latest
    build:
        context: .
        dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      # internal compose addresses, always point to the ome service here
      OME_API_ADDR: http://ome:8081
      OME_LLHLS_ADDR: http://ome:3333
    networks:
      - default
      - caddy
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      caddy: streamx.satont.dev
      caddy.handle_path: /api/*
      caddy.handle_path.0_reverse_proxy: "{{upstreams 1337}}"

  frontend:
    image: ghcr.io/satont/livestreamx:frontend-latest
    restart: always
    build:
        context: .
        dockerfile: apps/frontend/Dockerfile
    networks:
      - default
      - caddy
    labels:
      caddy: streamx.satont.dev
      caddy.reverse_proxy: "{{upstreams 8080}}"

  ome:
    image: ovenmedialabs/ovenmediaengine:v0.21.0
    restart: always
    environment:
      OME_API_ACCESS_TOKEN: ${OME_API_ACCESS_TOKEN:-livestreamx}
      OME_ADMISSION_URL: http://api:1337/streams/auth
      OME_ADMISSION_SECRET: ${OME_ADMISSION_SECRET:-livestreamx}
    ports:
      # rtmp ingest for obs
      - "1935:1935"
    networks:
      - default
      - caddy
    labels:
      caddy: streamx.satont.dev
      caddy.handle_path: /mtx/*
      caddy.handle_path.0_reverse_proxy: "{{upstreams 3333}}"
    volumes:
      - ./ome/Server.xml:/opt/ovenmediaengine/bin/origin_conf/Server.xml:ro
      - ./ome/Logger.xml:/opt/ovenmediaengine/bin/origin_conf/Logger.xml:ro

  redis:
    image: redis:latest
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis:/data

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: livestreamx
      POSTGRES_PASSWORD: livestreamx
      POSTGRES_DB: livestreamx
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2.10.11-scratch
    command: -js -m 8222
    restart: always

volumes:
    postgres:
    redis:

networks:
  caddy:
    external: true
